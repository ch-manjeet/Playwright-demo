name: CI - Playwright tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
        env-name: [staging, prod]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund || npm install
        env:
          CI: true
          BASE_URL: "${{ secrets.BASE_URL}}"

      - name: Install Playwright browsers and system deps
        run: npx playwright install --with-deps

      - name: Set BASE_URL for env
        run: echo "BASE_URL=${{ matrix.env-name == 'staging' && 'https://staging.pluralsight.com' || matrix.env-name == 'prod' && 'https://www.pluralsight.com' }}" >> $GITHUB_ENV

      - name: Run Playwright tests
        run: npx playwright test --reporter=list,junit,html
        env:
          CI: true
          BASE_URL: "${{ git}}"

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.env-name }}
          path: playwright-report

      - name: Upload Playwright test-results (traces / videos / screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.env-name }}
          path: test-results

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-results-${{ matrix.env-name }}
          path: junit-report.xml
